[env:m5stack-cardputer]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 1500000
lib_ldf_mode = deep+

build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

build_src_filter =
    +<main.cpp>
    -<runcpm_test.cpp>

lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    greiman/SdFat


[env:runcpm-test]
extends = env:m5stack-cardputer

build_src_filter =
    -<main.cpp>
    +<runcpm_test.cpp>